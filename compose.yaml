# Development setup. Copy .env.example to .env first; the password lives only in .env.
services:
  db:
    # Pinned by digest; Dependabot updates it.
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: commonage
      POSTGRES_USER: commonage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${COMMONAGE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commonage -d commonage"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Database=commonage;Username=commonage;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      # Only used on first start, when the archive has no users yet.
      InitialAdmin__Email: ${COMMONAGE_ADMIN_EMAIL:-}
      InitialAdmin__Password: ${COMMONAGE_ADMIN_PASSWORD:-}
      # "en" or "de" fills an empty archive with made-up demo content. See docs/operations.md.
      Demo__Language: ${COMMONAGE_DEMO:-}
      # Only if you changed the code: where your version's source is published (AGPL section 13).
      Source__Url: ${COMMONAGE_SOURCE_URL:-}
      # Encrypts the login keys in the database. See docs/deployment.md and docs/operations.md.
      DataProtection__Key: ${COMMONAGE_LOGIN_KEY:-}
    volumes:
      - media-data:/app/App_Data
    ports:
      - "127.0.0.1:${COMMONAGE_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media-data:
