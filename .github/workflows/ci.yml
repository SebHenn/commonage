name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # The tests start PostgreSQL in Docker through Testcontainers.
      - run: dotnet test --no-build -c Release

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full git history so a secret committed and later deleted is still caught.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --verbose --redact

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the Docker image, fills a new archive, backs it up, deletes it completely and restores it.
      - run: sh scripts/test-backup-restore.sh
